spring:
  datasource:
    url: jdbc:h2:mem:sam_test;DB_CLOSE_DELAY=-1;NON_KEYWORDS=VALUE;MODE=MySQL;DATABASE_TO_UPPER=false
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        physical_naming_strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
  flyway:
    enabled: false

jwt:
  secret: test_secret_key_for_unit_tests_only_256bits_minimum_please_000000
  expiration-ms: 3600000

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    br.com.sam: WARN
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
